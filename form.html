<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<body style="background-color:thistle; margin: 0;">
    <form action="#">
        <fieldset>
    <table align="center" cellpadding="5">
        <td><center><h1>FORM</h1></center></td>
        <tr>
            <td><label for="fname">First Name: </label></td>
            <td><input type="text" name="fname" id="fname" required placeholder="Enter your first name"></td>
        </tr>
   
        <tr>
            <td><label for="lname">Last Name: </label></td>
            <td><input type="text" name="lname" id="lname" required placeholder="Enter your last name"></td>
        </tr>
   
        <tr>
            <td><label for="dob">DOB: </label></td>
            <td><input type="date" name="dob" id="dob"></td>
        </tr>
    
        <tr>
            <td><label for="time">Appointment: </label></td>
            <td><input type="datetime-local" name="dtl" id="dtl"></td>
        </tr>
   
        <tr>
            <td><label for="email">E-Mail: </label></td>
            <td><input type="email" name="email" id="email"></td>
        </tr>
    
        <tr>
            <td><label for="">File: </label></td>
            <td><input type="file" name="file" id="file"></td>
        </tr>
    
        <tr>
            <td><label for=""></label></td>
            <td><input type="hidden" name="" id=""></td>
        </tr>
   
        <tr>
            <td><label for="range">Range: </label></td>
            <td><input type="range" name="range" id="range"></td>
        </tr>
    
        <tr>
            <td><label for="month">Month: </label></td>
            <td><input type="month" name="month" id="month"></td>
        </tr>
   
        <tr>
            <td><label for="number">Number: </label></td>
            <td><input type="number" name="number" id="number"></td>
        </tr>
   
        <tr>
            <td><label for="password">Password: </label></td>
            <td><input type="password" name="password" id="password"></td>
        </tr>
  
        <tr>
            <td><label for="tele">Telephone: </label></td>
            <td><input type="tele" name="tele" id="tele"></td>
        </tr>
    
        <tr>
            <td><label for="week">Week: </label></td>
            <td><input type="week" name="week" id="week"></td>
        </tr>
   
        <tr>
            <td><label for="time">Time: </label></td>
            <td><input type="time" name="time" id="time"></td>
        </tr>
    
        <tr>
            <td><label for="color">Color: </label></td>
            <td><input type="color" name="color" id="color"></td>
        </tr>
    
        <tr>
            <td><label for="search">SearchBox: </label></td>
            <td><input type="search" name="search" id="search"></td>
        </tr>
    
        <tr>
            <td><label for="gender">Gender: </label></td>
            <td><input type="radio" name="gender" id="gender">Male</input>
            <input type="radio" name="gender" id="gender">Female</input>
            </td>
        </tr>
    
        <tr>
            <td><label for="hobbies">Hobbies: </label></td>
            <td><input type="checkbox" name="hb" id="hb" checked>Singing</input>
            <input type="checkbox" name="hb" id="hb">Dance</input>
            <input type="checkbox" name="hb" id="hb">Draw</input>
            <input type="checkbox" name="hb" id="hb">Read</input>
            </td>
        </tr>
    
        <tr>
            <td><label for="city">City: </label></td>
            <td><select name="city" id="city">
            <option value="select">Select</option>
            <option value="bangalore">Bangalore</option>
            <option value="delhi">Delhi</option>
            <option value="mumbai">Mumbai</option>
            <option value="chennai">Chennai</option></select>
            </td>
        </tr>
    
        <tr>
            <td><label for="feedback">Feedback</label></td>
            <td><textarea name="feedback" id="feedback" cols="30" rows="3"></textarea></td>
        </tr>
    
        <tr>
            <td><label for="button">Button</label></td>
            <td>
                <input type="button" name="button" id="button">
                <input type="button" name="button" id="button">
            </td>
        </tr>
   
        <tr>
            <td><label for="submit">Submit</label></td>
            <td><input type="submit" name="submit" id="submit"></td>
        </tr>
    
        <tr>
            <td><label for="reset">Reset</label></td>
            <td><input type="reset" name="reset" id="reset"></td>
        </tr>
    </table>
    </fieldset>
</form>
</body>
</html>
