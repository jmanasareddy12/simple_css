<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            margin:0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: black;
        }
        .clock{
            padding: 30px 60px;
            font-size: 40px;
            background: black;
            border-radius: 15px;
            letter-spacing: 3px;
            box-shadow: 0 0 30px rgb(250, 86, 4);
            color:rgb(246, 100, 9)
        }
    </style>
</head>
<body>
    <div class="clock" id="clock">00:00:00</div>
    <script>
        function time(){
            let time=new Date();
            let h=time.getHours();
            let m=time.getMinutes();
            let s=time.getSeconds();

            h=(h<10)?"0"+h:h;
            m=(m<10)?"0"+m:m;
            s=(s<10)?"0"+s:s;
        
            document.getElementById("clock").innerHTML=h+":"+m+":"+s;
        }
        setInterval(time,1000);
        time();
    </script>
</body>
</html>
