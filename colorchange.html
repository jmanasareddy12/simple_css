<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
                border: 3px solid black;
                height: 20px; width: 130px;
                border-radius: 18px;
                animation: load 3s infinite;
        }
    @keyframes load{
        25%{background-color:brown;}
        75%{background-color: azure;}
        100%{background-color: slategray;}
    }
    </style>
</head>
<body>
    <div><center>HELLO</center></div>
</body>
</html>
