<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body{
            background-color: rgb(172, 199, 197); color: #333;
        }


        header{
            background: linear-gradient(135deg,skyblue,midnightblue);
        }
        header h1{font-size: 36px;}
        header p{margin-top:10px;font-size: 18px;}
        
        
        nav{
            background: #222;padding: 10px; text-align: center;
        }
        nav a{color: cornsilk;margin:0 15px;text-decoration: none;}
        nav a:hover{color: red;}
        
        
        section{
            padding: 50px 20px;max-width: 1000px;margin: auto;
        }
        section h2{text-align: center;}
    
     .about{text-align: center;}
     .skills{display: grid;gap:12px; text-align: center;grid-template-columns: repeat(auto-fit,minmax(150px,1fr));}
    
    .skill {
            background: white;
            padding: 10px;
            border-radius: 20px;
            box-shadow: 0 4px 10px grey;
        }

        /* PROJECTS */
        .projects {
            display: grid;
            gap: 20px;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        }

        .project {
            background: white;
            padding: 10px;
            border-radius: 25px;
            text-align: center;
        }

        .project button {
            margin-top: 10px;
            padding: 8px 12px;
            background: grey;
            color: white;
            border: none;  
            border-radius: 15px;
            cursor: pointer;
        }

        .project button:hover {
            background: blue;
        }

        /* CONTACT */
        .contact {
            text-align: center;
        }

        .contact input,
        .contact textarea {
            width: 80%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 15px;
            border: 1px solid blue;
        }

        .contact button {
            padding: 10px 20px;
            background: grey;
            color: white;
            border: none;
            border-radius: 15px;
            cursor: pointer;
        }

        .contact button:hover {
            background: blue;
        }

        footer {
            background: #222;
            color: white;
            text-align: center;
            padding: 15px;
            margin-top: 30px;
        }
    
    </style>
</head>
<body>
    
    <header>
        <h1> MEENA</h1>
        <p>Web Developer</p>
    </header>
    <nav>
        <a href="#about">ABOUT</a>
        <a href="#skills">SKILLS</a>
        <a href="#project">PROJECTS</a>
        <a href="#contact">CONTACT</a>
    </nav>




<br>

    <section id="about">
        <h2>ABOUT ME</h2>
        <p class="about">I enjoy building user-friendly web applications</p>
    </section>

    <section id="skills">`
        <h2>SKILLS</h2>
        <div class="skills">
            <div class="skill">python</div>
            <div class="skill">sql</div>
            <div class="skill">django</div>
            <div class="skill">power bi</div>
            <div class="skill">web technology</div>
        </div>
    </section>

    <section id="projects">
        <h2>PROJECTS</h2>
        <div class="projects">
            <div class="project">
                <h3>To Do Application</h3>
                <p>Task manager using html, css & javascript</p>
                <button onclick="alert('project demo')">VIEW</button>
            </div>
        </div>
    </section>

    <section id="contact">
        <h2>CONTACT ME</h2>
    
<div class="contact">
    <input type="text" placeholder="Enter your name">
    <input type="email" placeholder="Enter your email I'd">
    <textarea rows="4" placeholder="write your message here"></textarea>
    </div>
 


</section>
    
</body>
</html>
