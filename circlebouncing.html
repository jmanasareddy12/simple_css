<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            border: 4px solid red;
            height:275px; width: 275px;
            border-radius: 20%;
            background-image:linear-gradient(rgb(241, 151, 67),rgb(255, 0, 157));
            animation: load 2s linear infinite ;
        }
        .item{
            border: 3px black;
            height:30px;width: 30px;
            border-radius: 50%;
            margin: 30px;
            background-color: rgb(51, 238, 238);
            animation: bouncing 1.5s linear infinite alternate-reverse;
            
        }
        .item_ball2{
            border: 3px green;
            height:30px;width: 30px;
            border-radius: 50%;
            margin: 30px;
            background-color: rgb(30, 111, 231);
            animation: bounce 1s linear infinite alternate-reverse;
        }
        .item_ball3{
            border: 3px rgb(67, 204, 204);
            height:30px;width: 30px;
            border-radius: 50%;
            margin: 30px;
            background-color: rgb(10, 187, 33);
            animation: bouncee 1.5s linear infinite alternate-reverse;
        }
    @keyframes load{
        50%{transform: rotate(360deg);}
    }
    @keyframes bouncing{
        50%{transform: translateY(150px);}
        100%{transform: translateX(200px);}
    }
    @keyframes bounce{
        50%{transform: translateY(100px);}
        75%{transform: translateZ(100px);}
        100%{transform: translateX(200px);}
    }
    @keyframes bouncee{
        50%{transform: translateY(100px);}
        75%{transform: translateZ(100px);}
        100%{transform: translateX(200px);}
    }
    </style>
</head>
<body>
    <div class="container"><div class="item"></div><div class="item_ball2"></div><div class="item_ball3"></div>
</body>
</html>
